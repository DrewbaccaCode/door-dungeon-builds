name: Build desktop releases

on:
  push:
    branches: [main]
    paths: [build-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-desktop-release
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build instructions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the requested game version
        id: request
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          request = json.loads(pathlib.Path("build-request.json").read_text())
          sha = request["source_sha"]
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid source commit in build request")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\n")
          PY

      - name: Check out the private game for this build only
        uses: actions/checkout@v4
        with:
          repository: DrewbaccaCode/door-dungeon
          ref: ${{ steps.request.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: Remember Godot and its templates between builds
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-desktop-templates

      - name: Get Godot and its export templates
        run: |
          if [ -x "$RUNNER_TEMP/godot-bin/godot" ] && [ -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/macos.zip" ]; then
            cp "$RUNNER_TEMP/godot-bin/godot" "$RUNNER_TEMP/godot"
            exit 0
          fi
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64.exe templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/macos.zip -d "$dest"
          rm "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-bin" && cp "$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot-bin/godot"

      - name: Bake in the configured relay address
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          request = json.loads(pathlib.Path("../build-request.json").read_text())
          relay = request.get("relay_address", "")
          if not isinstance(relay, str):
              raise SystemExit("Invalid relay address in build request")
          if relay:
              project = pathlib.Path("project.godot")
              content, count = re.subn(r"^relay_address=.*$", lambda _: "relay_address=" + json.dumps(relay), project.read_text(), flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit("Could not find the project's relay setting")
              project.write_text(content)
          PY

      - name: Import the project
        working-directory: source
        run: timeout 600 "$RUNNER_TEMP/godot" --headless --editor --path . --import

      - name: Check dungeon saves, multiplayer and Colosseum
        working-directory: source
        run: |
          G="$RUNNER_TEMP/godot"
          for fixture in v101 auto_points v102 loot_102; do
            timeout 120 "$G" --headless --fixed-fps 30 --path . -- --class=warrior --seed=5 --skip-intro "--test=$fixture" > "$fixture.log" 2>&1
            cat "$fixture.log"
            if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' "$fixture.log"; then exit 1; fi
          done
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --mobile --phone=1170x540 --safe=40,0,40,14 --test=v101_menu > mobile-menus.log 2>&1
          cat mobile-menus.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' mobile-menus.log; then exit 1; fi
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --test=v103_menu > menus-103.log 2>&1
          cat menus-103.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' menus-103.log; then exit 1; fi
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --mobile --phone=1170x540 --safe=40,0,40,14 --test=v103_menu > phone-menus-103.log 2>&1
          cat phone-menus-103.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' phone-menus-103.log; then exit 1; fi
          timeout 120 "$G" --headless --fixed-fps 60 --path . -- --test=arena_presentation > arena-presentation.log 2>&1
          cat arena-presentation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' arena-presentation.log; then exit 1; fi
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --mobile --phone=1170x540 --safe=40,0,40,14 --test=arena_presentation > phone-arena.log 2>&1
          cat phone-arena.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' phone-arena.log; then exit 1; fi
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --class=wizard --mode=pvp --seed=5 --skip-intro --test=v104 > arena-104.log 2>&1
          cat arena-104.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' arena-104.log; then exit 1; fi
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --mobile --phone=1170x540 --safe=40,0,40,14 --class=wizard --mode=pvp --seed=5 --skip-intro --test=v104 > phone-arena-104.log 2>&1
          cat phone-arena-104.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' phone-arena-104.log; then exit 1; fi
          timeout 180 "$G" --headless --fixed-fps 60 --path . -- --class=wizard --mode=pvp --seed=5 --skip-intro --test=pvp_match > bot-matches.log 2>&1
          cat bot-matches.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL|PVP MATCH FAILED' bot-matches.log; then exit 1; fi
          timeout 240 python3 tests/v101_net.py "$G"
          timeout 120 "$G" --headless --fixed-fps 30 --path . -- --class=wizard --mode=pvp --seed=5 --skip-intro --test=pvp > pvp.log 2>&1
          cat pvp.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' pvp.log; then exit 1; fi
          timeout 180 "$G" --headless --fixed-fps 30 --path . -- --class=wizard --mode=pvp --seed=5 --skip-intro --test=pvp_abilities > pvp-abilities.log 2>&1
          cat pvp-abilities.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^FAIL' pvp-abilities.log; then exit 1; fi
          timeout 120 python3 tests/v102_net.py "$G"
          timeout 120 python3 tests/pvp_net.py "$G"

      - name: Export Windows, macOS and Linux
        working-directory: source
        run: |
          G="$RUNNER_TEMP/godot"
          mkdir -p build/windows build/mac build/linux dist
          "$G" --headless --path . --export-release "Windows Desktop" "build/windows/One Thousand Door Dungeon.exe"
          "$G" --headless --path . --export-release "macOS" "build/mac/One Thousand Door Dungeon.zip"
          "$G" --headless --path . --export-release "Linux" "build/linux/door_dungeon.x86_64"
          test -s "build/windows/One Thousand Door Dungeon.exe"
          test -s "build/mac/One Thousand Door Dungeon.zip"
          test -s "build/linux/door_dungeon.x86_64"
          (cd build/windows && zip -q -r ../../dist/OneThousandDoorDungeon-Windows.zip .)
          cp "build/mac/One Thousand Door Dungeon.zip" dist/OneThousandDoorDungeon-macOS.zip
          chmod +x build/linux/door_dungeon.x86_64
          (cd build/linux && zip -q -r ../../dist/OneThousandDoorDungeon-Linux.zip .)
          for archive in dist/*.zip; do unzip -tq "$archive"; done

      - name: Check that the exported game starts without the editor
        working-directory: source
        run: |
          timeout 60 build/linux/door_dungeon.x86_64 --headless --quit-after 120 -- --class=wizard --seed=5 --skip-intro > runtime-smoke.log 2>&1
          cat runtime-smoke.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' runtime-smoke.log; then exit 1; fi
          grep -q 'FLOOR 1:' runtime-smoke.log

      - name: Publish complete downloads as the latest release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.sha }}
        run: |
          version=$(python3 -c 'import pathlib,re; text=pathlib.Path("project.godot").read_text(); match=re.search(r"^config/version=\"([^\"]+)\"",text,re.M); print(match.group(1) if match else "development")')
          tag="build-${SOURCE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.txt <<EOF
          One Thousand Door Dungeon for Windows, macOS, and Linux. No Godot installation required.

          Download the ZIP for your computer, extract it, and run the game.
          Windows: run One Thousand Door Dungeon.exe.
          macOS: run One Thousand Door Dungeon.app. This development build is not notarized; approve it in macOS Privacy & Security if prompted.
          Linux: run door_dungeon.x86_64.

          Version: ${version}
          Game commit: ${SOURCE_SHA}
          Built: $(date -u '+%Y-%m-%d %H:%M UTC')
          EOF
          python3 - <<'PYNOTES'
          import pathlib
          readme = pathlib.Path("README.md").read_text()
          import re
          version = re.search(r'^config/version="([^"]+)"', pathlib.Path("project.godot").read_text(), re.M).group(1)
          marker = f"## Version {version}\n"
          if marker in readme:
              notes = readme.split(marker, 1)[1].split("\n## ", 1)[0]
              with open("release-notes.txt", "a") as output:
                  output.write(f"\nWhat's new in {version}\n" + notes)
          PYNOTES
          gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Version ${version}" --notes-file release-notes.txt --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Downloads: https://github.com/$GITHUB_REPOSITORY/releases/latest" >> "$GITHUB_STEP_SUMMARY"
